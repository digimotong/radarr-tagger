version: 2
updates:
  # GitHub Actions are pinned to commit SHAs in the workflows, so this is what
  # keeps them current (and is the supported way to bump a pinned action).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  # Tracks the pinned python:3.12-slim-* base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
